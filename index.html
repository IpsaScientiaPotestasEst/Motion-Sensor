<!DOCTYPE html>
<html lang="en">

<head>
    <title>Motion Sensor</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #111;
            color: #eee;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        /* Main camera styling */
        #cam {
            width: 80vw;              /* big on desktop */
            max-width: 900px;         /* large but not too large */
            margin-top: 30px;
            border-radius: 12px;
            border: 3px solid #444;
            box-shadow: 0 0 20px rgba(0,0,0,0.6);
        }

        #out {
            margin-top: 20px;
            font-size: 2rem;
            font-weight: bold;
        }

        /* Mobile-friendly adjustments */
        @media (max-width: 600px) {
            #cam {
                width: 95vw;          /* fill the phone screen nicely */
                max-width: none;      /* remove desktop limit */
                margin-top: 15px;
            }

            #out {
                font-size: 1.5rem;    /* slightly smaller text on phones */
            }
        }
    </style>
</head>

<body>

    <video id="cam" autoplay playsinline></video>
    <h3 id="out"></h3>

    <script>

        function beep(){
            let a = new AudioContext();
            let o = a.createOscillator();
            o.connect(a.destination);
            o.start();
            o.stop(a.currentTime + 0.15);
        }

        navigator.mediaDevices.getUserMedia({ video: true }).then(s => cam.srcObject = s);

        let prev;

        function loop() {
            let canvas = document.createElement("canvas");

            canvas.width = 50; canvas.height = 50;

            let ctx = canvas.getContext("2d");

            ctx.drawImage(cam, 0, 0, 50, 50);

            let now = ctx.getImageData(0,0,50,50).data;

            if (prev) {
                let diff = 0;
                for (let i = 0; i < now.length; i++) {
                    diff += Math.abs(now[i] - prev[i]);
                }

                let m = (diff / now.length);
                
                if (/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)) {
                    if (m >= 0 && m < 20) {
                        beep();
                    }

                else if (m >= 20) {
                    beep();
                    }
                }

                else {
                    
                    if (m >= 10 && m < 25) {
                    beep();
                }

                else if (m >= 25) {
                    beep();
                }

                }
            }


            prev = now;

            requestAnimationFrame(loop)
        };

        loop();

    </script>

</body>

</html>
