<!DOCTYPE html>
<html lang="en">

<head>
    <title>Motion Sensor</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #111;
            color: #eee;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        #cam {
            width: 90%;
            max-width: 500px;
            margin-top: 30px;
            border-radius: 12px;
            border: 3px solid #444;
            box-shadow: 0 0 20px rgba(0,0,0,0.6);
        }

        #out {
            margin-top: 20px;
            font-size: 1.8rem;
            font-weight: bold;
            padding: 10px 20px;
            display: inline-block;
            border-radius: 8px;
            background: #222;
            border: 2px solid #555;
        }
    </style>
</head>

<body>

    <video id="cam" autoplay playsinline></video>
    <h3 id="out"></h3>

    <script>

        function beep(){
            let a = new AudioContext();
            let o = a.createOscillator();
            o.connect(a.destination);
            o.start();
            o.stop(a.currentTime + 0.15);
        }

        navigator.mediaDevices.getUserMedia({ video: true }).then(s => cam.srcObject = s);

        let prev;

        function loop() {
            let canvas = document.createElement("canvas");

            canvas.width = 50; canvas.height = 50;

            let ctx = canvas.getContext("2d");

            ctx.drawImage(cam, 0, 0, 50, 50);

            let now = ctx.getImageData(0,0,50,50).data;

            if (prev) {
                let diff = 0;
                for (let i = 0; i < now.length; i++) {
                    diff += Math.abs(now[i] - prev[i]);
                }

                let m = (diff / now.length);
                let out = document.getElementById("out");

                if (m < 5 && m >= 0) {
                    out.textContent = "Motion: Minimal";
                }

                else if (m >= 5 && m < 20) {
                    out.textContent = "Motion: Medium";
                }

                else if (m >= 20) {
                    out.textContent = "Motion: Maximum";
                    beep();
                }

                else {out.textContent = "Error"}
            }

            prev = now;

            requestAnimationFrame(loop)
        };

        loop();

    </script>

</body>

</html>
